[theme]
base                = "dark"

# ── Paleta Clean & Modern SaaS ─────────────────────────────────────────────
# Acento: blanco puro para máxima legibilidad sobre fondo oscuro
primaryColor        = "#FFFFFF"

# Fondo principal: gris carbón oscuro (Streamlit default dark, elevado)
backgroundColor     = "#0E1117"

# Sidebar e inputs: gris ligeramente más claro
secondaryBackgroundColor = "#1E1E1E"

# Texto: blanco suave
textColor           = "#E8EAF0"

# Fuente del sistema — Inter via CSS override
font                = "sans serif"

[server]
headless            = true
